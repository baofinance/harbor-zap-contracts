[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
# Emit storage layout JSON under `out/` for upgrade diffing (`forge inspect <Contract> storageLayout`).
extra_output = ["storageLayout"]

auto_detect_remappings = false # remappings seem to cause problems
optimizer = true

optimizer_runs = 700 # 500 builds & tests but 200 deploys

via_ir = true   # Required for permit functions to avoid stack too deep errors
# deny = "warnings" # enable to stop compilations if there are warnings
# Note: Library dependencies (lib/) may have warnings, but our source code (src/) has none.
# Warnings are currently disabled to allow compilation with library warnings.

fuzz.gas_report_samples = 64 # gas report doesn't need so many test cases
gas_reports_ignore = [
  "ERC20Mock",
  "ERC1967Proxy",
  "MockBaoAccessControl",
  "TestTokenDistributor",
  "Useful",
  "MockAggregator",
  "MockWrappedPriceOracle",
]

fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./results" },
  { access = "read-write", path = "./log" },
  { access = "read-write", path = "./deployments" },
]

gas_limit = "18446744073709551615"

[lint]
exclude_lints = ["mixed-case-function"]
lint_on_build = false

# slither building profile - removes vyper
[profile.novyper]
skip = ["**/*.vy"]

[vyper]
path = ".venv/bin/vyper"
# version = "0.3.10"
# evm_version = "shanghai" # or "london", "cancun" depending on your target
optimize = "gas"
# optimize_runs = 700
# via_ir = false           # you can enable this later if needed


[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
megaeth = "${MEGAETH_RPC_URL}"
local = "${LOCAL_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
