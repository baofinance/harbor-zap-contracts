# this file is copy of lib/bao-base/.github/workflows/CI-test-foundry-stable.yml
# the only modification is in the location of the action.
# TODO: check in the bao-base action to see if this file is up-to-date (modulo directory) with the lib/bao-base version it is a modified copy of
# if not, it should fail.
#
# Secrets: ALCHEMY_KEY is a GitHub Actions secret. It is injected only for trusted
# runs (push / same-repo PR / workflow_dispatch). Fork PRs do not receive org secrets,
# so MAINNET_RPC_URL stays empty and RPC-backed tests fail closed instead of calling /v2/.
# Scoping the URL onto the test step (not workflow-wide) limits inheritance.

name: test-foundry-stable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_foundry_os:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            foundry: stable

          - os: macos-latest
            foundry: stable

          # - os: windows-latest
          #   foundry: stable

      fail-fast: false # ensure all jobs run even if one fails

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Run Bao-base CI actions
        uses: ./lib/bao-base/.github/actions/test-foundry
        env:
          # Empty when ALCHEMY_KEY is unavailable (e.g. fork PRs).
          MAINNET_RPC_URL: ${{ secrets.ALCHEMY_KEY != '' && format('https://eth-mainnet.g.alchemy.com/v2/{0}', secrets.ALCHEMY_KEY) || '' }}
        with:
          foundry: ${{ matrix.foundry }}
